[workspace]
resolver = "2"
members = ["crates/shared", "crates/api", "crates/worker", "crates/seed"]
# Crate Tauri berdiri sendiri (target build desktop terpisah dari server).
exclude = ["clients/desktop-tauri/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["RSUD Kota Kendari"]

[workspace.dependencies]
# --- core ---
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
figment = { version = "0.10", features = ["env"] }

# --- web ---
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
async-trait = "0.1"

# --- db ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "bigdecimal",
    "json",
    "migrate",
    "macros",
] }
bigdecimal = { version = "0.4", features = ["serde"] }

# --- auth ---
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

# --- cache & jobs ---
moka = { version = "0.12", features = ["future", "sync"] }
tokio-cron-scheduler = "0.13"

# --- validation ---
validator = { version = "0.20", features = ["derive"] }

# --- seed / excel ---
calamine = "0.28"

# --- fase lanjutan (cetak/label/export) ---
rust_xlsxwriter = "0.87"

# --- internal ---
sarpras-shared = { path = "crates/shared" }
sarpras-worker = { path = "crates/worker" }

[profile.release]
lto = "thin"
strip = true
