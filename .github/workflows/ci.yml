name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sarpras
          POSTGRES_PASSWORD: sarpras_dev_pw
          POSTGRES_DB: sarpras_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sarpras:sarpras_dev_pw@localhost:5432/sarpras_dev
      TEST_DATABASE_URL: postgres://sarpras:sarpras_dev_pw@localhost:5432/sarpras_test
      JWT_SECRET: ci-secret-0123456789-0123456789-abcdef
      ADMIN_INITIAL_PASSWORD: Admin123
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Siapkan database test
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE sarpras_test OWNER sarpras;" || true

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  audit:
    name: Audit dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web-spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/web-spa/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build
